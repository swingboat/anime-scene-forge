<!doctype html><meta charset="utf-8"><title>海风里的暑假 · 内部审看</title><style>body{margin:0;background:#121a20;color:#e8edf0;font:16px system-ui}main{max-width:1280px;margin:20px auto}video{width:100%;max-height:calc(100vh - 155px);object-fit:contain;background:#000}button,select{font:inherit;margin:8px;padding:8px;background:#edf4ed;border:0;border-radius:4px}pre{white-space:pre-wrap}</style><main><h2>海风里的暑假 · 1×审看</h2><select id="source"><option value="../../public/candidates/scene-02-v1.mp4">4秒滑行短测</option><option value="../../public/video/scene-01-v1.mp4">镜头一</option><option value="../../public/video/scene-02-v1.mp4">镜头二</option><option value="../../public/video/scene-03-v1.mp4">镜头三</option><option value="../../outputs/review-candidate.mp4">12秒候选</option><option value="../../outputs/final.mp4">12秒正式导出</option></select><button id="start">从头1倍速播放</button><video id="v" controls preload="auto" playsinline></video><pre id="status"></pre></main><script>const v=document.querySelector('video'),s=document.querySelector('select'),status=document.querySelector('pre');let log=[];function load(){v.src=s.value;log=[]}s.onchange=load;load();document.querySelector('button').onclick=async()=>{v.currentTime=0;v.playbackRate=1;v.muted=false;await v.play()};for(const name of ['play','pause','ended','error','loadedmetadata'])v.addEventListener(name,()=>{log.push({event:name,time:v.currentTime,rate:v.playbackRate,muted:v.muted,error:v.error?.message??null,at:new Date().toISOString()});status.textContent=JSON.stringify({source:v.currentSrc,duration:v.duration,currentTime:v.currentTime,rate:v.playbackRate,paused:v.paused,ended:v.ended,error:v.error?.message??null,events:log},null,2)});window.playbackEvidence=()=>({source:v.currentSrc,duration:v.duration,time:v.currentTime,rate:v.playbackRate,paused:v.paused,ended:v.ended,muted:v.muted,error:v.error?.message??null,events:log});</script>
